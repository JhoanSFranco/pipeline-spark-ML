name: project-airbnb-spark

services:

  # ============================================================
  # SPARK MASTER + JUPYTERLAB
  # ============================================================
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-airbnb-spark:4.2.0
    container_name: project-airbnb-spark-master
    hostname: spark-master

    networks:
      - network1

    ports:
      - "9080:8080"      # Spark Master Web UI
      - "7077:7077"      # Spark Master
      - "4040:4040"      # Spark Application UI
      - "8888:8888"      # JupyterLab

    volumes:
      # Whole repository, same path in every container: notebooks, src/, data/
      # and outputs/ are visible, and relative paths work on master and workers.
      - .:/opt/project
      - ./spark-logs:/tmp/spark-events
    working_dir: /opt/project

    environment:
      SPARK_ROLE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080

      SPARK_LOCAL_IP: spark-master
      SPARK_MASTER_CORES: 2

      JUPYTER_ENABLE: "true"
      JUPYTER_PORT: 8888

    # Run as the host user so files written into the repo are not owned by root
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    restart: unless-stopped


  # ============================================================
  # SPARK WORKER A
  # ============================================================
  spark-worker-a:
    image: project-airbnb-spark:4.2.0
    container_name: project-airbnb-spark-worker-a
    hostname: spark-worker-a

    networks:
      - network1

    depends_on:
      - spark-master

    mem_limit: 2g

    ports:
      - "9082:8080"

    volumes:
      # Whole repository, same path in every container: notebooks, src/, data/
      # and outputs/ are visible, and relative paths work on master and workers.
      - .:/opt/project
      - ./spark-logs:/tmp/spark-events
    working_dir: /opt/project

    environment:
      SPARK_ROLE: worker

      SPARK_MASTER_URL: spark://spark-master:7077

      SPARK_WORKER_CORES: 3
      SPARK_WORKER_MEMORY: 1G
      SPARK_EXECUTOR_MEMORY: 1G

      SPARK_LOCAL_IP: spark-worker-a
      SPARK_WORKER_WEBUI_PORT: 8080

    # Run as the host user so files written into the repo are not owned by root
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    restart: unless-stopped


  # ============================================================
  # SPARK WORKER B
  # ============================================================
  spark-worker-b:
    image: project-airbnb-spark:4.2.0
    container_name: project-airbnb-spark-worker-b
    hostname: spark-worker-b

    networks:
      - network1

    depends_on:
      - spark-master

    mem_limit: 2g

    ports:
      - "9083:8080"

    volumes:
      # Whole repository, same path in every container: notebooks, src/, data/
      # and outputs/ are visible, and relative paths work on master and workers.
      - .:/opt/project
      - ./spark-logs:/tmp/spark-events
    working_dir: /opt/project

    environment:
      SPARK_ROLE: worker

      SPARK_MASTER_URL: spark://spark-master:7077

      SPARK_WORKER_CORES: 3
      SPARK_WORKER_MEMORY: 1G
      SPARK_EXECUTOR_MEMORY: 1G

      SPARK_LOCAL_IP: spark-worker-b
      SPARK_WORKER_WEBUI_PORT: 8080

    # Run as the host user so files written into the repo are not owned by root
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    restart: unless-stopped


  # ============================================================
  # SPARK WORKER C
  # ============================================================
  spark-worker-c:
    image: project-airbnb-spark:4.2.0
    container_name: project-airbnb-spark-worker-c
    hostname: spark-worker-c

    networks:
      - network1

    depends_on:
      - spark-master

    mem_limit: 2g

    ports:
      - "9084:8080"

    volumes:
      # Whole repository, same path in every container: notebooks, src/, data/
      # and outputs/ are visible, and relative paths work on master and workers.
      - .:/opt/project
      - ./spark-logs:/tmp/spark-events
    working_dir: /opt/project

    environment:
      SPARK_ROLE: worker

      SPARK_MASTER_URL: spark://spark-master:7077

      SPARK_WORKER_CORES: 3
      SPARK_WORKER_MEMORY: 1G
      SPARK_EXECUTOR_MEMORY: 1G

      SPARK_LOCAL_IP: spark-worker-c
      SPARK_WORKER_WEBUI_PORT: 8080

    # Run as the host user so files written into the repo are not owned by root
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    restart: unless-stopped


  # ============================================================
  # SPARK HISTORY SERVER
  # ============================================================
  spark-history-server:
    image: project-airbnb-spark:4.2.0
    container_name: project-airbnb-spark-history
    hostname: spark-history

    networks:
      - network1

    depends_on:
      - spark-master

    ports:
      - "18080:18080"

    volumes:
      - ./spark-logs:/tmp/spark-events

    environment:
      SPARK_ROLE: history

      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=/tmp/spark-events
        -Dspark.history.ui.port=18080

    # Run as the host user so files written into the repo are not owned by root
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    restart: unless-stopped


# ============================================================
# NETWORK
# ============================================================
networks:
  network1:
    name: project-airbnb-spark-network
    driver: bridge